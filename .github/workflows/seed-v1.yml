name: seed-v1

on:
  push:
    paths:
      - ".github/workflows/seed-v1.yml"

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove this leftover seed workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/seed-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/seed-v1.yml
          git diff --cached --quiet || git commit -m "Remove leftover Open Today seed workflow."
          git push
